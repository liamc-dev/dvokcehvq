<a class="skip-link" href="#main-content" (click)="skipToContent($event, main)">Skip to stories</a>

<mat-toolbar class="toolbar">
  <div class="bar">
    <a class="brand" routerLink="/">
      <span class="logo" aria-hidden="true">Y</span>
      <span>HN Reader</span>
    </a>
    <div class="actions">
      <nav aria-label="Feeds">
        <!-- Switching feed starts again at page 1 but keeps the chosen page size. -->
        @for (feed of feeds; track feed.path) {
          <a
            matButton
            [routerLink]="feed.path"
            [queryParams]="{ page: null }"
            queryParamsHandling="merge"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
          >
            {{ feed.label }}
          </a>
        }
      </nav>
      <button
        matIconButton
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="themeLabel()"
        [title]="themeLabel()"
      >
        <mat-icon>{{ theme.scheme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>
  </div>
</mat-toolbar>

<main #main id="main-content" class="content" tabindex="-1">
  <router-outlet />
</main>

<footer class="footer">
  Stories from the
  <a href="https://github.com/HackerNews/API">official Hacker News API</a>
</footer>
